[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MAGverify"
version = "0.1.0"
description = "PacBio HiFi read-supported assessment of metagenomic assembly and MAG integrity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
MAGverify = "magverify_cli:main"

[tool.setuptools]
packages = ["modules", "scripts"]
py-modules = ["magverify_cli"]
include-package-data = true

[tool.setuptools.package-data]
modules = ["*.sh"]
