name: MAGverify
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel

  # Read mapping and alignment processing
  - minimap2=2.31
  - samtools=1.21
  - bedtools=2.31.1

  # Assembly integrity analyses
  - anvio-minimal=9
  - blast=2.17.0
  - mmseqs2=17.b804f
  - prodigal=2.6.3
  - meryl=1.4.1
  - hmmer=3.4

  - wget

  # Install MAGverify from this checkout
  - pip:
      - -e .
